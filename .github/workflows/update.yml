name: Update SRTG NAV Dashboard

on:
  schedule:
    # Runs daily at 10:30 UTC = 17:30 WIB (Jakarta), after the IDX close (16:00-16:15 WIB)
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}   # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch prices, compute NAV, build dashboard
        run: python scripts/fetch_and_calculate.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "srtg-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.csv latest.json index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update: NAV data as of $(date -u +'%Y-%m-%d')"
            git pull --rebase origin main
            git push
          fi
